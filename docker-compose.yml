services:
  redis:
    image: redis:7-alpine
    container_name: pspa-redis
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: pspa-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  php-fpm-1:
    build: ./php
    container_name: pspa-php-1
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./app:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - redis
    networks:
      - app-network

  php-fpm-2:
    build: ./php
    container_name: pspa-php-2
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    volumes:
      - ./app:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - redis
    networks:
      - app-network

  nginx-backend-1:
    image: nginx:alpine
    container_name: pspa-nginx-backend-1
    volumes:
      - ./app:/var/www
      - ./nginx/backend1/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm-1
    networks:
      - app-network

  nginx-backend-2:
    image: nginx:alpine
    container_name: pspa-nginx-backend-2
    volumes:
      - ./app:/var/www
      - ./nginx/backend2/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm-2
    networks:
      - app-network

  nginx-lb:
    image: nginx:alpine
    container_name: pspa-nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/load-balancer/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx-backend-1
      - nginx-backend-2
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: pspa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: pspa_db
      MYSQL_USER: pspa_user
      MYSQL_PASSWORD: pspa_password
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network

volumes:
  mysql-data:
  es-data:

networks:
  app-network:
    driver: bridge
